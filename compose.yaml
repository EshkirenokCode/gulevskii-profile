name: gulevskii-profile
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: local_profile
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U profile -d profile"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profile:local_profile@db:5432/profile
      PRISMA_LOG_QUERIES: ${PRISMA_LOG_QUERIES:-0}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/graphql', { headers: { Accept: 'text/html' } }).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
